global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'eureka-microservices'
    eureka_sd_configs:
      - server: 'http://eureka-server:8761/eureka'
    relabel_configs:
      # Mengarahkan Prometheus ke endpoint /actuator/prometheus milik Spring Boot
      - target_label: __metrics_path__
        replacement: /actuator/prometheus
      # Menggunakan nama aplikasi dari Eureka sebagai label 'job'
      - source_labels: [__meta_eureka_app_name]
        target_label: job